name: set_pronunciation
description: 'Processes the sound from /raw/words into the /static dir and sets its data to Terraform JSON'
publish_to: none

environment:
  sdk: ^3.1.0

dependencies:
  clock: ^1.1.1
  common_dart: { path: ../../common_dart }
  common_dart_backend: { path: ../../common_dart_backend }
  path: ^1.8.3

dependency_overrides:
  firestore_api_parser:
    git:
      url: https://github.com/alexeyinkin/firestore_api_parser.git
      ref: 935e5a7c91cd7b6ab9c17b6cefc232c00a91baba
