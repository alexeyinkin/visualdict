name: visualdict

environment:
  sdk: ^3.0.0
  flutter: '>=3.10.0'

dependencies:
  app_state: ^0.9.4
  #audioplayers: ^5.1.0
  cached_network_image: ^3.2.3
  clock: ^1.1.1
  cloud_firestore: ^4.8.4
  common_dart: { path: ../common_dart }
  common_dart_backend: { path: ../common_dart_backend }
  easy_localization: ^3.0.2
  easy_localization_loader: { git: { url: https://github.com/aissat/easy_localization_loader.git, ref: efca2087b52198c7fbd6a59488d149a4b1ec939c } }
  enum_map: ^0.3.0
  firebase_analytics: ^10.4.5
  firebase_core: ^2.15.0
  flag: ^7.0.0
  flutter: { sdk: flutter }
  flutter_markdown: ^0.6.17+1
  flutter_svg: ^2.0.7
  fluttertoast: ^8.2.2
  get_it: ^7.6.0
  google_fonts: ^5.1.0
  json_annotation: ^4.8.1
  keyed_collection_widgets: ^0.4.3
  model_editors: ^0.2.0
  model_fetch: ^0.5.5
  model_fetch_firestore: ^0.5.5
  model_fetch_firestore_json_files: ^0.5.5
  model_fetch_flutter: ^0.5.5
  model_interfaces: ^0.3.1
  shared_preferences: ^2.2.1
  url_launcher: ^6.1.12
  url_strategy: ^0.2.0
  version: ^3.0.2

dev_dependencies:
  build_runner: ^2.4.6
  enum_map_gen: ^0.3.0
  json_serializable: ^6.7.1
  total_lints: ^3.0.0

dependency_overrides:
  model_editors: { path: ../../dart/flutter-model-editors }
  model_fetch: { path: ../../dart/dart-model-fetch/model_fetch }
  model_fetch_firestore: { path: ../../dart/dart-model-fetch/model_fetch_firestore }
  model_fetch_firestore_json_files: { path: ../../dart/dart-model-fetch/model_fetch_firestore_json_files }
  model_fetch_flutter: { path: ../../dart/dart-model-fetch/model_fetch_flutter }

flutter:
  uses-material-design: true

  assets:
    - assets/images/no-image.svg
    - assets/translations/en.yaml
    - assets/translations/ru.yaml
    - web/icons/Icon-192.png
